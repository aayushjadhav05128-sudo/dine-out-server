name: Keep Render Server Awake

on:
  schedule:
    # Runs every 10 minutes (cron runs in UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          echo "Pinging Dine Hub Render Server..."
          curl -I -s https://dine-out-server.onrender.com/api/ping
